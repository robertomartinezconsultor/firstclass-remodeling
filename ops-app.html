<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>First Class Ops</title>
<meta name="theme-color" content="#09111d">
<style>
body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  color:#f8fbff;
  background:linear-gradient(180deg,#0f1f37 0%,#091321 45%,#050a12 100%);
  display:grid;
  place-items:center;
}
.card{
  width:min(420px,calc(100vw - 32px));
  border-radius:30px;
  padding:24px;
  border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));
  backdrop-filter:blur(26px) saturate(145%);
  -webkit-backdrop-filter:blur(26px) saturate(145%);
  box-shadow:0 30px 90px rgba(0,0,0,.45);
}
h1{
  margin:0 0 8px;
  font-size:36px;
  line-height:.98;
  letter-spacing:-.05em;
}
p{
  margin:0 0 18px;
  color:rgba(238,243,252,.72);
  line-height:1.55;
}
.grid{
  display:grid;
  gap:10px;
}
a{
  color:#f8fbff;
  text-decoration:none;
  padding:14px 16px;
  border-radius:18px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
strong{display:block;margin-bottom:4px}
small{display:block;color:rgba(238,243,252,.72)}
</style>
</head>
<body>
  <div class="card">
    <h1>Ops Center</h1>
    <p>Separate internal launcher for the First Class team.</p>
    <div class="grid">
      <a href="https://firstclassremodelingtx.com/monitor.html"><div><strong>Bot Monitor</strong><small>Workflow health and automation status.</small></div><span>Open</span></a>
      <a href="https://firstclassremodelingtx.com"><div><strong>Main Website</strong><small>Public marketing site.</small></div><span>Open</span></a>
    </div>
  </div>
</body>
</html>
